name: Daily NAV update

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and update NAV archive
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
        run: python scripts/fetch_and_update.py --r2-sync

      - name: Validate archive
        run: python scripts/validator.py

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f latest_nav.csv data/schemes.csv 2>/dev/null || true
          if [ -d data ]; then
            find data \( -name "*.csv.gz" -o -name "schemes.json.gz" \) -print0 | xargs -0 --no-run-if-empty git add
          fi
          if git diff --cached --quiet; then
            echo "No NAV changes to commit"
          else
            git commit -m "Daily NAV update"
            git push
          fi

      - name: Alert on workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 AMFI Feed Drift / Daily NAV Update Failure" \
            --body "Daily NAV update workflow failed on $(date -u '+%Y-%m-%d %H:%M:%S UTC'). Please check workflow logs for feed layout changes, validation errors, or sanity gate failures: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "bug" || echo "Note: Could not open GitHub issue; verify repository permissions."
