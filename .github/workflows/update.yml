name: Daily NAV update

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
      - "logs/**"

concurrency:
  group: nav-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch and update NAV archive
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
        run: python scripts/fetch_and_update.py --r2-sync

      - name: Validate archive
        run: python scripts/validator.py --window-days 90

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data ]; then
            find data \( -name "*.csv.gz" -o -name "schemes.json.gz" -o -name "latest.json" -o -name ".feed_profile.json" \) -print0 | xargs -0 --no-run-if-empty git add
          fi
          if git diff --cached --quiet; then
            echo "No NAV changes to commit"
          else
            git commit -m "Daily NAV update"
            git pull --rebase origin ${GITHUB_REF_NAME} || git pull --rebase
            git push
          fi

      - name: Alert on workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 AMFI Feed Drift / Daily NAV Update Failure"
          EXISTING=$(gh issue list --state open --search "${TITLE} in:title" --json number --jq 'length' 2>/dev/null) || EXISTING=0
          if [ "${EXISTING:-0}" -gt 0 ]; then
            echo "An open failure issue already exists; skipping duplicate."
            exit 0
          fi
          gh issue create \
            --title "${TITLE}" \
            --body "Daily NAV update workflow failed on $(date -u '+%Y-%m-%d %H:%M:%S UTC'). Please check workflow logs for feed layout changes, validation errors, or sanity gate failures: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "bug" || echo "Note: Could not open GitHub issue; verify repository permissions."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
